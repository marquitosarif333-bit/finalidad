<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Universidad NovaTech del Valle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg-main: #fcf8f2;
            --green-ghibli: #2c5339;
            --terracotta: #9b3e22;
            --wood-dark: #1b2822;
            --border-soft: #d3cdbf;
            --accent-gold: #c69214;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, rgba(27, 40, 34, 0.9), rgba(44, 83, 57, 0.8)), url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .registro-flotante {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        .btn-mostrar-registro {
            background: rgba(255, 255, 255, 0.9);
            color: var(--wood-dark);
            border: 1px solid var(--border-soft);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn-mostrar-registro:hover {
            background: var(--green-ghibli);
            color: white;
        }

        .modal-registro {
            display: none;
            position: fixed;
            top: 75px;
            left: 20px;
            background: var(--bg-main);
            width: 320px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid var(--border-soft);
            text-align: left;
            z-index: 101;
        }
        .modal-registro h3 { font-size: 15px; color: var(--wood-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .modal-registro h3 button { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--terracotta); }

        .login-card {
            background: var(--bg-main);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-soft);
            text-align: center;
        }
        .login-logo {
            width: 55px; height: 55px;
            background: var(--green-ghibli);
            color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; font-size: 24px;
            margin: 0 auto 12px auto;
        }
        .login-card h1 { font-size: 22px; color: var(--wood-dark); margin-bottom: 2px; }
        .login-card p { font-size: 12px; color: #555555; margin-bottom: 15px; font-weight: 600; }
        
        .badge-ubicacion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e8f0e9;
            color: var(--green-ghibli);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 20px;
            border: 1px solid #c8dbc9;
        }

        .campo-login { text-align: left; margin-bottom: 15px; }
        .campo-login label { display: block; font-size: 11px; font-weight: 700; color: var(--wood-dark); margin-bottom: 4px; }
        .input-grupo { position: relative; display: flex; align-items: center; }
        .input-grupo i { position: absolute; left: 12px; color: var(--green-ghibli); font-size: 13px; }
        .campo-login input, .campo-login select {
            width: 100%; border: 1px solid var(--border-soft);
            border-radius: 8px; padding: 10px 10px 10px 36px;
            font-size: 12px; outline: none; background: #ffffff;
        }
        .btn-ingresar, .btn-cliente-portal, .btn-registrar-usuario {
            width: 100%; border: none; padding: 11px; border-radius: 8px;
            font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s;
            margin-top: 5px;
        }
        .btn-ingresar { background: var(--green-ghibli); color: white; }
        .btn-ingresar:hover { background: #1b2822; }

        /* Segundo Botón debajo del de entrar para acceso de Clientes */
        .btn-cliente-portal {
            background: var(--accent-gold);
            color: var(--wood-dark);
            border: 1px solid #b38010;
        }
        .btn-cliente-portal:hover {
            background: #b38010;
            color: white;
        }

        .btn-registrar-usuario { background: var(--green-ghibli); color: white; }
        .btn-registrar-usuario:hover { background: #1b2822; }

        #mensajeError, #mensajeExito {
            margin-top: 10px; font-size: 11px; font-weight: 700;
            display: none;
        }
        #mensajeError { color: var(--terracotta); }
        #mensajeExito { color: var(--green-ghibli); }
    </style>
</head>
<body>

    <div class="registro-flotante">
        <button type="button" id="btnToggleRegistro" class="btn-mostrar-registro">
            <i class="fa-solid fa-user-plus"></i> Registrar Usuario
        </button>
        <div id="modalRegistro" class="modal-registro">
            <h3>Nuevo Registro <button type="button" id="CerrarModal">&times;</button></h3>
            <form id="formRegistro">
                <div class="campo-login">
                    <label>Nombre Completo</label>
                    <div class="input-grupo">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="regNombre" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>
                <div class="campo-login">
                    <label>Correo Electrónico</label>
                    <div class="input-grupo">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regCorreo" placeholder="correo@unova.edu.mx" required>
                    </div>
                </div>
                <div class="campo-login">
                    <label>Contraseña</label>
                    <div class="input-grupo">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="campo-login">
                    <label>Permiso / Rol</label>
                    <div class="input-grupo">
                        <i class="fa-solid fa-shield-halved"></i>
                        <select id="regRol" style="padding-left: 36px;">
                            <option value="admin">Administrador</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-registrar-usuario">Guardar Usuario</button>
                <div id="mensajeExito">¡Usuario registrado con éxito!</div>
            </form>
        </div>
    </div>

    <div class="login-card">
        <div class="login-logo"><i class="fa-solid fa-tree"></i></div>
        <h1>UNOVA</h1>
        <p>Universidad NovaTech del Valle</p>
        
        <div class="badge-ubicacion">
            <i class="fa-solid fa-location-dot"></i> México
        </div>

        <form id="formLogin">
            <div class="campo-login">
                <label for="usuario">Correo o Usuario</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usuario" placeholder="ej. marcos@unova.edu.mx o admin" required>
                </div>
            </div>
            <div class="campo-login">
                <label for="password">Contraseña</label>
                <div class="input-grupo">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>
            <!-- Botón Principal (Admin / Acceso General) -->
            <button type="submit" class="btn-ingresar">ENTRAR</button>
            
            <!-- Segundo Botón debajo del de entrar (Específico para clientes / Portal de Citas e Imagenes) -->
            <button type="button" id="btnAccesoCliente" class="btn-cliente-portal">
                <i class="fa-solid fa-calendar-check"></i> ACCESO CLIENTES Y RESERVACIONES
            </button>

            <div id="mensajeError">Credenciales no válidas.</div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#btnToggleRegistro').click(function() {
                $('#modalRegistro').fadeToggle(200);
            });
            $('#CerrarModal').click(function() {
                $('#modalRegistro').fadeOut(200);
            });

            $('#formRegistro').submit(function(e) {
                e.preventDefault();
                let nombre = $('#regNombre').val().trim();
                let correo = $('#regCorreo').val().trim().toLowerCase();
                let password = $('#regPassword').val().trim();
                let rol = $('#regRol').val();

                let listaUsuarios = JSON.parse(localStorage.getItem("unova_usuarios_registrados")) || [];
                let existe = listaUsuarios.find(u => u.correo === correo);
                if(existe) {
                    alert("Este correo ya está registrado.");
                    return;
                }

                listaUsuarios.push({ nombre, correo, password, rol });
                localStorage.setItem("unova_usuarios_registrados", JSON.stringify(listaUsuarios));

                $('#mensajeExito').fadeIn().delay(2000).fadeOut();
                $('#formRegistro')[0].reset();
                setTimeout(() => $('#modalRegistro').fadeOut(200), 1500);
            });

            const usuariosOrganigrama = [
                { id: "marcos@unova.edu.mx", rol: "admin" },
                { id: "nicolas@unova.edu.mx", rol: "admin" },
                { id: "roman@unova.edu.mx", rol: "admin" },
                { id: "azzeneth@unova.edu.mx", rol: "admin" },
                { id: "eduardo@unova.edu.mx", rol: "cliente" },
                { id: "luis@unova.edu.mx", rol: "cliente" },
                { id: "eros@unova.edu.mx", rol: "cliente" },
                { id: "enrique@unova.edu.mx", rol: "cliente" },
                { id: "eder@unova.edu.mx", rol: "admin" },
                { id: "juan@unova.edu.mx", rol: "cliente" },
                { id: "ismael@unova.edu.mx", rol: "cliente" },
                { id: "carmen@unova.edu.mx", rol: "cliente" },
                { id: "angel@unova.edu.mx", rol: "cliente" },
                { id: "maria@unova.edu.mx", rol: "cliente" }
            ];

            // Función común para validar usuario y contraseña ingresados
            function validarCredenciales() {
                let inputUsuario = $.trim($("#usuario").val()).toLowerCase();
                let password = $.trim($("#password").val());
                let rolEncontrado = null;

                if (!inputUsuario || !password) {
                    $("#mensajeError").text("Por favor ingresa usuario y contraseña.").fadeIn();
                    return null;
                }

                if (password === "volovan_8hz") {
                    if (inputUsuario === "admin") rolEncontrado = "admin";
                    if (inputUsuario === "cliente") rolEncontrado = "cliente";
                }

                let miembroOrg = usuariosOrganigrama.find(u => u.id === inputUsuario);
                if (miembroOrg && (password === "volovan_8hz" || password === "unova2026")) {
                    rolEncontrado = miembroOrg.rol;
                }

                let listaRegistrados = JSON.parse(localStorage.getItem("unova_usuarios_registrados")) || [];
                let usuarioReg = listaRegistrados.find(u => u.correo === inputUsuario && u.password === password);
                if (usuarioReg) {
                    rolEncontrado = usuarioReg.rol;
                }

                if (rolEncontrado) {
                    localStorage.setItem("unova_sesion_activa", "true");
                    localStorage.setItem("unova_rol", rolEncontrado);
                    localStorage.setItem("unova_usuario_actual", inputUsuario);
                }

                return rolEncontrado;
            }

            // 1. Botón Principal (ENTRAR)
            $("#formLogin").submit(function (e) {
                e.preventDefault();
                let rolEncontrado = validarCredenciales();

                if (rolEncontrado) {
                    $(".btn-ingresar").text("Accediendo...").css("background", "#4a7c59");
                    setTimeout(function() {
                        if (rolEncontrado === "admin") {
                            window.location.href = "inventario.html";
                        } else {
                            window.location.href = "cliente.html";
                        }
                    }, 800);
                } else {
                    $("#mensajeError").text("Usuario o contraseña incorrectos.").fadeIn();
                    $("#password").val("");
                }
            });

            // 2. Segundo Botón (ACCESO CLIENTES Y RESERVACIONES)
            $("#btnAccesoCliente").click(function() {
                let rolEncontrado = validarCredenciales();

                if (rolEncontrado) {
                    if (rolEncontrado === "admin") {
                        alert("Los administradores deben ingresar por el botón principal para gestionar el inventario.");
                        window.location.href = "inventario.html";
                    } else {
                        // Si es cliente, redirige al portal de bienvenida y citas inspirado en las imágenes
                        window.location.href = "cliente.html";
                    }
                } else {
                    $("#mensajeError").text("Verifica tus datos antes de acceder como cliente.").fadeIn();
                }
            });
        });
    </script>
</body>
</html>
